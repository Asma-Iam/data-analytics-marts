version: 2
sources:
  - name: jaffle_shop
    database: dev
    description: "Jaffle Shop coffee shop raw data"
    schema: raw
    meta:
      owner: "Data Team"

    tables:
      - name: customers
        identifier: raw_customers
        description: "Customer information"
      - name: orders
        identifier: raw_orders
        description: "Order transactions"
      - name: payments
        identifier: raw_payments
        description: "Payment records"

# Add the models documentation below the sources section
models:
  - name: stg_customers
    description: "Cleaned and standardized customer data, with renamed columns."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer, renamed from 'id'."
      - name: first_name
        description: "Customer's first name."
      - name: last_name
        description: "Customer's last name."

  - name: stg_orders
    description: "Normalized order information with clear foreign key naming."
    columns:
      - name: order_id
        description: "Unique order identifier, renamed from 'id'."
      - name: customer_id
        description: "Foreign key to customers, renamed from 'user_id'."
      - name: order_date
        description: "Date when the order was placed."
      - name: status
        description: "Order status (e.g., completed, pending)."

  - name: stg_payments
    description: "Converted payment amounts from cents to dollars and standardized columns."
    columns:
      - name: payment_id
        description: "Unique payment identifier, renamed from 'id'."
      - name: order_id
        description: "Foreign key to orders."
      - name: payment_method
        description: "Method used for payment (credit card, PayPal, etc.)."
      - name: amount
        description: "Payment amount in dollars, converted from cents."
